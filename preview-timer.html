      <div>
        <div class="v" id="statFocus">0m</div>
        <div class="l">专注时长</div>
      </div>
    </div>
    <div class="btm-item">
      <div>
        <div class="v" id="statPomodoros">0</div>
        <div class="l">番茄完成</div>
      </div>
    </div>
    <div class="btm-progress">

/* ===== Ambient Glow System (Classic Dark) ===== */
let mistTweens = [];
function ensureAmbientGlow() {
  const s = document.documentElement.getAttribute('data-style');
  const t = document.documentElement.getAttribute('data-theme');
  if (s === 'cozy' || t === 'light') return;
  if (document.querySelector('.ambient-glow')) return;
  const c = document.createElement('div');
  c.className = 'ambient-glow';
  c.innerHTML = '<div class="ambient-glow-layer bg"></div><div class="ambient-glow-layer mid"></div><div class="ambient-glow-layer fg"></div>';
  document.body.prepend(c);
  if (!window.gsap) return;
  const sl = document.getElementById('mistSlider');
  updateMistSpeed(sl ? parseInt(sl.value) : 5);
}
function updateMistSpeed(v) {
  const f = Math.pow(5, (v - 5) / 5);
  mistTweens.forEach(function(t) { if (t) t.kill(); });
  mistTweens = [];
  const con = document.querySelector('.ambient-glow');
  if (!con || !window.gsap) return;
  con.querySelectorAll('.ambient-glow-layer').forEach(function(l) {
    // Position drift — continuous random movement
    mistTweens.push(gsap.to(l, {
      x: function() { return (Math.random() - 0.5) * 90 + '%'; },
      y: function() { return (Math.random() - 0.5) * 90 + '%'; },
      rotation: function() { return (Math.random() - 0.5) * 16; },
      scale: function() { return 1 + Math.random() * 0.12; },
      duration: function() { return (8 + Math.random() * 16) / f; },
      ease: 'sine.inOut', repeat: -1, repeatRefresh: true
    }));
    // Opacity breathing — fade in & out like clouds forming/dissipating
    mistTweens.push(gsap.fromTo(l,
      { opacity: function() { return 0.12 + Math.random() * 0.18; } },
      { opacity: function() { return 0.55 + Math.random() * 0.3; },
        duration: function() { return (5 + Math.random() * 10) / f; },
        ease: 'sine.inOut', yoyo: true, repeat: -1, repeatRefresh: true
      }
    ));
  });
}
ensureAmbientGlow();
function fmtTime(s) { return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }
function fmtDate(d) { const w=['Sun','Mon','Tue','Wed','Thu','Fri','Sat']; return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${w[d.getDay()]}`; }
function dkey(d) { return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }
function todayKey() { return dkey(new Date()); }
function esc(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

let tt;
function toast(m) {
  const e=document.getElementById('toast'); e.textContent=m; e.classList.add('show');

  if (window.gsap) {
    gsap.killTweensOf(e);
    gsap.fromTo(e, { scale: 0.92 }, { scale: 1, duration: 0.3, ease: "back.out(1.7)", clearProps: "transform" });
  }
  tt=setTimeout(()=>{
    if (window.gsap) {
      gsap.to(e, { opacity: 0, duration: 0.2, ease: "power2.in", onComplete: () => { e.classList.remove('show'); gsap.set(e, { clearProps: "opacity" }); } });
    } else {

    }
  }, 1900);
}
function safeSet(key, value) {

function playDoneSound() {

    window._beepAudio.play().catch(function(e){ console.error('beep replay failed:', e); });

  // First call: fetch data URI from main process, then cache Audio element
  if (window.electronAPI?.getBeepDataUri) {

}

/* ——— Data File Bridge ——— */
async function syncAllToFile() {
  if (!window.electronAPI?.writeDataFile) return;
  try {
    const now = new Date().toISOString();
    const data = {
      updatedAt: now,
      settings: loadSettings(),
      theme: getThemePref(),
      style: getStylePref(),
      days: {}
    };
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key.startsWith('dft_tasks_')) {
        const dk = key.slice('dft_tasks_'.length);
        if (!data.days[dk]) data.days[dk] = {};
        try { data.days[dk].tasks = JSON.parse(localStorage.getItem(key)); } catch {}
      }
      if (key.startsWith('dft_stats_')) {
        const dk = key.slice('dft_stats_'.length);
        if (!data.days[dk]) data.days[dk] = {};
        try { data.days[dk].stats = JSON.parse(localStorage.getItem(key)); } catch {}
      }
    }
    await window.electronAPI.writeDataFile(data);
    try { localStorage.setItem('dft_lastSyncAt', now); } catch {}
  } catch (e) { console.error('Sync to file failed:', e); }
}
async function mergeFromFile() {
  if (!window.electronAPI?.readDataFile) return;
  try {
    const fileData = await window.electronAPI.readDataFile();
    if (!fileData || !fileData.days) return;
    // Timestamp guard: skip if file is older than or equal to last sync
    const lastSyncAt = (() => { try { return localStorage.getItem('dft_lastSyncAt'); } catch { return null; } })();
    if (lastSyncAt && fileData.updatedAt && fileData.updatedAt <= lastSyncAt) {
      return; // File is stale; app has more recent changes
    }
    let changed = false;
    for (const [dk, day] of Object.entries(fileData.days)) {
      if (day.tasks) { localStorage.setItem('dft_tasks_'+dk, JSON.stringify(day.tasks)); changed = true; }
      if (day.stats) { localStorage.setItem('dft_stats_'+dk, JSON.stringify(day.stats)); changed = true; }
    }
    if (fileData.settings) { SET=fileData.settings; saveSettings(SET); upSetUI(); changed=true; }
    if (fileData.theme) { setTheme(fileData.theme); changed=true; }
    if (fileData.style) { setStyle(fileData.style); changed=true; }
    if (changed) {
      loadTasks(activeDay); renderTasks(); updateDateNav(); upAll(); renderHM();
      if (document.getElementById('vcalendar')?.classList.contains('active')) renderCal();
      toast(t('toastSynced'));
    }
    // Update lastSyncAt to file's timestamp so we don't re-merge stale data
    try { localStorage.setItem('dft_lastSyncAt', fileData.updatedAt || new Date().toISOString()); } catch {}
  } catch (e) { console.error('Merge from file failed:', e); }
}

function loadSettings() {
  try { return JSON.parse(localStorage.getItem('dft_settings'))||{focus:25,short:5,long:15}; } catch {}

}
function saveSettings(s) { return safeSet('dft_settings',s); }

// Timer
const CIRC=2*Math.PI*83.8;
const T={mode:'FOCUS',state:'idle',_tl:(SET.focus||25)*60,endsAt:0,interval:null,sessions:0,focusSec:0,get timeLeft(){return this._tl;},set timeLeft(v){this._tl=Math.max(0,Math.ceil(v));}};
function dur(m) {
  const k=m==='FOCUS'?'focus':m==='SHORT_BREAK'?'short':'long';
  return (SET[k]||25)*60;
}
function modeLbl(m) { return m==='FOCUS'?t('focus').toUpperCase():m==='SHORT_BREAK'?t('shortBreak').toUpperCase():t('longBreak').toUpperCase(); }

function upT() {
  document.getElementById('timerDisplay').textContent = fmtTime(T.timeLeft);
  document.getElementById('timerLabel').textContent = modeLbl(T.mode);
  const d = dur(T.mode);
  document.getElementById('timerProgress').style.strokeDashoffset = CIRC*(1-T.timeLeft/d);
  document.querySelectorAll('.mode-tab').forEach(t=>t.classList.toggle('active',t.dataset.mode===T.mode));
  const wrap = document.getElementById('timerRingWrap');
  wrap.classList.toggle('is-running', T.state==='running');
  const btn = document.getElementById('timerStartBtn');
  if (T.state==='running') {
    btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="margin-right:2px;"><rect x="3" y="2" width="3" height="10" rx="1" fill="currentColor"/><rect x="8" y="2" width="3" height="10" rx="1" fill="currentColor"/></svg> '+t('pause');
    btn.classList.add('is-running');
  } else {
    btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="margin-right:2px;"><path d="M4 11.5V2.5l8 4.5-8 4.5z" fill="currentColor"/></svg> '+(T.state==='paused'?t('resume'):t('start'));
    btn.classList.remove('is-running');
  }
}
function tick() {
  T.timeLeft=(T.endsAt-Date.now())/1000;
  if (T.timeLeft<=0) {
    completeTimer();
    return;
  }
  upT();
}
function completeTimer() {
  T.timeLeft=0; clearInterval(T.interval); T.interval=null; T.endsAt=0; T.state='idle';
  if (T.mode==='FOCUS') { T.sessions++; T.focusSec+=dur('FOCUS'); toast(t('toastFocusComplete')+T.sessions+t('toastPomodoro')); playDoneSound(); switchMode('SHORT_BREAK'); }
  else { toast(t('toastBreakEnd')); playDoneSound(); switchMode('FOCUS'); }
  saveStats(); upAll(); upT();
}
function startT() { if(T.state==='running') return; if(T.timeLeft<=0) T.timeLeft=dur(T.mode); T.endsAt=Date.now()+T.timeLeft*1000; T.state='running'; T.interval=setInterval(tick,250); tick(); }
function pauseT() { if(T.state!=='running') return; T.timeLeft=(T.endsAt-Date.now())/1000; clearInterval(T.interval); T.interval=null; T.endsAt=0; T.state='paused'; upT(); }
function toggleT() { T.state==='running'?pauseT():startT(); }
function resetT() { clearInterval(T.interval); T.interval=null; T.endsAt=0; T.state='idle'; T.timeLeft=dur(T.mode); upT(); }
function switchMode(m) { clearInterval(T.interval); T.interval=null; T.endsAt=0; T.state='idle'; T.mode=m; T.timeLeft=dur(m); upT(); }

/* ——— Drag & Drop sorting (event delegation) ——— */
(function() {
  const list = document.getElementById('taskList');
  if (!list) return;

  list.addEventListener('dragstart', (e) => {
    const item = e.target.closest('.task-item');
    if (!item) { e.preventDefault(); return; }
    // Don't drag from interactive elements
    if (e.target.closest('button, input, textarea, select')) {
      e.preventDefault();
      return;
    }
    e.dataTransfer.setData('text/plain', item.dataset.id);
    e.dataTransfer.effectAllowed = 'move';
    item.classList.add('dragging');
  });

  list.addEventListener('dragover', (e) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const item = e.target.closest('.task-item');
    if (!item) return;

    // Clear indicators from all items
    list.querySelectorAll('.drag-over-before, .drag-over-after').forEach(el => {
      el.classList.remove('drag-over-before', 'drag-over-after');
    });

    // Top half → insert at target's position (border-top), bottom half → insert after (border-bottom)
    const rect = item.getBoundingClientRect();
    const y = e.clientY - rect.top;
    if (y < rect.height / 2) {
      item.classList.add('drag-over-before');
    } else {
      item.classList.add('drag-over-after');
    }
  });

  list.addEventListener('dragleave', (e) => {
    const item = e.target.closest('.task-item');
    if (!item) return;
    // Only remove if truly leaving the task-item, not moving between its children
    if (!e.relatedTarget || !item.contains(e.relatedTarget)) {
      item.classList.remove('drag-over-before', 'drag-over-after');
    }
  });

  list.addEventListener('drop', (e) => {
    e.preventDefault();
    list.querySelectorAll('.drag-over-before, .drag-over-after, .dragging').forEach(el => {
      el.classList.remove('drag-over-before', 'drag-over-after', 'dragging');
    });

    const fromId = e.dataTransfer.getData('text/plain');
    const targetItem = e.target.closest('.task-item');
    if (!fromId || !targetItem || fromId === targetItem.dataset.id) return;

    const fromIdx = tasks.findIndex(t => t.id === fromId);
    const toId = targetItem.dataset.id;
    const originalToIdx = tasks.findIndex(t => t.id === toId);
    if (fromIdx === -1 || originalToIdx === -1) return;

    // Determine insertion mode: after target (bottom half) or at target's position (top half)
    const isAfter = targetItem.classList.contains('drag-over-after');

    const [moved] = tasks.splice(fromIdx, 1);
    const newToIdx = tasks.findIndex(t => t.id === toId);

    let insertAt;
    if (isAfter) {
      // Bottom half → insert AFTER target
      insertAt = newToIdx + 1;
    } else {
      // Top half → insert AT target's position (replace it)
      // When dragging from earlier index, target shifted left by 1
      insertAt = fromIdx < originalToIdx ? newToIdx + 1 : newToIdx;
    }
    tasks.splice(insertAt, 0, moved);

    saveTasks();
    renderTasks();
  });

  list.addEventListener('dragend', () => {
    list.querySelectorAll('.dragging, .drag-over-before, .drag-over-after').forEach(el => {
      el.classList.remove('dragging', 'drag-over-before', 'drag-over-after');
    });
  });
})();

// Heatmap
function renderHM() {
  const c=document.getElementById('hmTable');
  const today=new Date(), weeks=12;
  const dow=today.getDay()||7;
  const end=new Date(today); end.setDate(today.getDate()-(dow-1)+6);
  const start=new Date(end); start.setDate(end.getDate()-weeks*7+1);
  const map={};
  const d=new Date(start);
  while(d<=end) {
    const key=dkey(d), data=dayData(key);
    const dn=data.tasks.filter(t=>t.done).length, tl=data.tasks.length;
    const ts=tl>0?dn/tl:0, ps=Math.min((data.stats.pomodoros||0)/8,1), sc=ts*0.6+ps*0.4;
    const lvl=sc===0?0:sc<=0.25?1:sc<=0.5?2:sc<=0.75?3:4;
    map[key]={score:sc,lvl:lvl,tasks:`${dn}/${tl}`,pomos:data.stats.pomodoros||0};
    d.setDate(d.getDate()+1);
  }
  let h='<div class="hm-ys">'+LANG[_lang].hmDayN.map(n=>`<span>${n}</span>`).join('')+'</div><div class="hm-cols">';
  for(let w=0;w<weeks;w++) {
    h+='<div class="hm-wk">';
    for(let dy=0;dy<7;dy++) {
      const cd=new Date(start); cd.setDate(start.getDate()+w*7+dy);
      const key=dkey(cd), info=map[key], lvl=info?info.lvl:0;
      const fut=cd>today;
      const tip = info&&!fut ? `${key} ✅ ${info.tasks} 🍅 ${info.pomos}` : '';
      h+=`<div class="hm-c" data-lvl="${fut?0:lvl}" style="${fut?'opacity:0.1':''}" title="${tip}"></div>`;
    }
    h+='</div>';
  }
  h+='</div>';
  c.innerHTML=h;
}

      renderTasks();
      if (targetDate !== activeDay || !wasOnDate) updateDateNav();
      toast(t('fromAlfred') + t('toastUpdated'));
    });
  }

  // HTTP bridge — delete task from Claude (DELETE)
  if (window.electronAPI?.onExternalDeleteTask) {
    window.electronAPI.onExternalDeleteTask((data) => {
      const targetDate = data.date || activeDay;
      const wasOnDate = activeDay === targetDate;
      if (targetDate !== activeDay) {
        viewDate = new Date(targetDate);
        loadTasks(targetDate);
      }
      const task = tasks.find(t => t.id === data.id);
      if (!task) { toast(t('fromAlfred') + t('toastNotFound')); return; }
      delTask(data.id);
      if (targetDate !== activeDay || !wasOnDate) updateDateNav();
      toast(t('fromAlfred') + t('toastDeleted'));
    });
  }

  // Fallback: poll data file every 60s (in case app was closed and reopened)
  setInterval(() => mergeFromFile(), 60000);

  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&T.state==='running') tick();});
  setInterval(refreshDayIfNeeded,60000);

  // Auto-start toggle — init from Electron settings
  if (window.electronAPI) {
    window.electronAPI.getAutoStart().then(enabled => {
      const toggle = document.getElementById('autoStartToggle');
      if (toggle) toggle.checked = enabled;
    });
    document.getElementById('autoStartToggle')?.addEventListener('change', (e) => {
      window.electronAPI.setAutoStart(e.target.checked);
    });
  }

  // Enable smooth transitions after initial render
  document.documentElement.classList.add('theme-ready');
});
</script>
</body>
</html>
